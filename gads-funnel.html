<meta charset="utf-8">
<title>Google Ads Funnel Diagnostic — Tier 1</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#F8F9FB;color:#111827;font-family:system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.6;min-height:100vh}

/* layout */
.top-bar{background:#fff;border-bottom:1px solid #E0E4ED;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:100}
.logo{font-family:Georgia,serif;font-size:16px;color:#111827}
.logo span{color:#B8760A;font-size:13px;margin-left:8px;font-family:system-ui;font-weight:600;letter-spacing:.04em}

.controls{padding:16px 24px 0;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.city-tabs{display:flex;gap:6px;flex-wrap:wrap}
.city-tab{padding:7px 14px;border-radius:20px;border:1px solid #D8DCE8;background:#fff;color:#374151;font-size:13px;cursor:pointer;transition:all .15s}
.city-tab:hover{border-color:#B8760A;color:#B8760A}
.city-tab.active{background:#111827;color:#fff;border-color:#111827}
.cat-toggle{display:flex;border:1px solid #D8DCE8;border-radius:20px;overflow:hidden;background:#fff}
.cat-btn{padding:7px 18px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:transparent;color:#6B7280;transition:all .15s}
.cat-btn.active-sh{background:#15803D;color:#fff}
.cat-btn.active-sti{background:#0D7F76;color:#fff}

/* main content */
.main{padding:20px 24px 60px;display:grid;grid-template-columns:340px 1fr;gap:20px;max-width:1200px}
@media(max-width:820px){.main{grid-template-columns:1fr}}

/* funnel column */
.funnel-col{}
.city-verdict{background:#fff;border:1px solid #E0E4ED;border-radius:8px;padding:14px 16px;margin-bottom:14px}
.verdict-city{font-size:18px;font-weight:700;color:#111827;margin-bottom:2px}
.verdict-cat{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.verdict-cat.sh{color:#15803D}.verdict-cat.sti{color:#0D7F76}
.verdict-badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:3px}
.vb-scale{background:rgba(21,128,61,.1);color:#15803D;border:1px solid rgba(21,128,61,.2)}
.vb-fix{background:rgba(201,90,20,.1);color:#C95A14;border:1px solid rgba(201,90,20,.2)}
.vb-crit{background:rgba(196,43,43,.1);color:#C42B2B;border:1px solid rgba(196,43,43,.2)}
.vb-maintain{background:rgba(29,96,181,.1);color:#1D60B5;border:1px solid rgba(29,96,181,.2)}
.vb-grow{background:rgba(107,45,181,.1);color:#6B2DB5;border:1px solid rgba(107,45,181,.2)}
.vb-opt{background:rgba(184,118,10,.1);color:#B8760A;border:1px solid rgba(184,118,10,.2)}

/* funnel stages */
.funnel-stages{display:flex;flex-direction:column;gap:0}
.stage-wrap{position:relative}
.stage-connector{width:2px;height:12px;background:#D8DCE8;margin:0 auto}
.stage{background:#fff;border:1px solid #E0E4ED;border-radius:8px;padding:12px 14px;cursor:pointer;transition:all .18s;position:relative}
.stage:hover{border-color:#aaa}
.stage.active{border-color:#111827;box-shadow:0 0 0 2px rgba(17,24,39,.08)}
.stage.broken{border-color:#C42B2B;border-left:3px solid #C42B2B}
.stage.warn{border-color:#C95A14;border-left:3px solid #C95A14}
.stage.good{border-color:#15803D;border-left:3px solid #15803D}

.stage-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.stage-left{flex:1}
.stage-num{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#9CA3AF;margin-bottom:2px}
.stage-name{font-size:13px;font-weight:600;color:#111827;margin-bottom:4px}
.stage-metric{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.sm-good{color:#15803D}.sm-warn{color:#C95A14}.sm-bad{color:#C42B2B}
.stage-sub{font-size:11px;color:#6B7280;margin-top:1px}
.stage-status{flex-shrink:0;font-size:11px;font-weight:700;padding:3px 8px;border-radius:3px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.ss-good{background:rgba(21,128,61,.08);color:#15803D;border:1px solid rgba(21,128,61,.2)}
.ss-warn{background:rgba(201,90,20,.08);color:#C95A14;border:1px solid rgba(201,90,20,.2)}
.ss-bad{background:rgba(196,43,43,.08);color:#C42B2B;border:1px solid rgba(196,43,43,.2)}

.stage-mini-bars{display:flex;gap:8px;margin-top:8px}
.mini-bar-item{flex:1}
.mini-bar-label{font-size:10px;color:#9CA3AF;margin-bottom:2px}
.mini-bar-track{height:5px;background:#F0F1F4;border-radius:3px;overflow:hidden}
.mini-bar-fill{height:100%;border-radius:3px;transition:width .3s}
.mf-red{background:#C42B2B}.mf-amber{background:#C95A14}.mf-green{background:#15803D}.mf-blue{background:#1D60B5}.mf-gray{background:#9CA3AF}

/* detail panel */
.detail-col{}
.detail-panel{background:#fff;border:1px solid #E0E4ED;border-radius:8px;overflow:hidden;min-height:400px}
.detail-empty{display:flex;align-items:center;justify-content:center;height:400px;color:#9CA3AF;font-size:13px;flex-direction:column;gap:8px}
.detail-header{padding:16px 20px;border-bottom:1px solid #E0E4ED;background:#F8F9FB}
.dh-stage{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#9CA3AF;margin-bottom:4px}
.dh-title{font-size:16px;font-weight:700;color:#111827;margin-bottom:4px}
.dh-status{font-size:13px;color:#374151}
.detail-body{padding:20px}

/* decision tree blocks */
.decision-block{margin-bottom:18px}
.db-question{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#6B7280;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #F0F1F4}
.lever-row{display:flex;gap:10px;margin-bottom:8px;align-items:flex-start}
.lever-icon{font-size:15px;flex-shrink:0;width:22px;text-align:center;margin-top:1px}
.lever-body{}
.lever-name{font-size:13px;font-weight:600;color:#111827}
.lever-yn{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:2px;margin-left:6px}
.lever-yes{background:rgba(21,128,61,.1);color:#15803D}
.lever-no{background:rgba(196,43,43,.1);color:#C42B2B}
.lever-why{font-size:12px;color:#6B7280;margin-top:2px;line-height:1.5}

.action-list{list-style:none;display:flex;flex-direction:column;gap:7px;margin-top:8px}
.action-list li{display:flex;gap:8px;font-size:13px;color:#374151;line-height:1.5}
.action-list li::before{content:"→";color:#B8760A;flex-shrink:0;font-weight:700}
.action-list li strong{color:#111827}

.review-block{background:#F8F9FB;border:1px solid #E0E4ED;border-radius:6px;overflow:hidden;margin-top:8px}
.rb-header{padding:10px 14px;background:#F0F1F4;border-bottom:1px solid #E0E4ED;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#374151}
.rb-row{display:grid;grid-template-columns:120px 1fr 1fr;gap:8px;padding:8px 14px;border-bottom:1px solid #F0F1F4;align-items:center;font-size:12px}
.rb-row:last-child{border-bottom:none}
.rb-clinic{color:#111827;font-weight:600}
.rb-bar{display:flex;align-items:center;gap:6px}
.rb-fill{height:8px;border-radius:4px;min-width:4px}
.rb-num{font-size:11px;color:#6B7280;white-space:nowrap;font-variant-numeric:tabular-nums}
.rb-gap{font-size:11px;font-weight:700}
.gap-crit{color:#C42B2B}.gap-high{color:#C95A14}.gap-ok{color:#15803D}

.prm-box{background:rgba(21,128,61,.04);border:1px solid rgba(21,128,61,.2);border-left:3px solid #15803D;border-radius:5px;padding:12px 14px;margin-top:12px}
.prm-box-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#15803D;margin-bottom:8px}
.prm-prompts{list-style:none;display:flex;flex-direction:column;gap:5px}
.prm-prompts li{font-size:12px;color:#374151;display:flex;gap:7px;line-height:1.5;font-style:italic}
.prm-prompts li::before{content:"⟶";color:#15803D;flex-shrink:0;font-style:normal}
.prm-themes{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.prm-theme{font-size:11px;padding:2px 7px;border-radius:3px;background:rgba(184,118,10,.08);color:#B8760A;border:1px solid rgba(184,118,10,.2)}

.lab-box{background:rgba(13,127,118,.05);border:1px solid rgba(13,127,118,.2);border-left:3px solid #0D7F76;border-radius:5px;padding:12px 14px;margin-bottom:12px}
.lab-box-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#0D7F76;margin-bottom:6px}
.lab-rivals{display:flex;flex-direction:column;gap:4px}
.lab-rival{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#374151;padding:3px 0;border-bottom:1px solid rgba(13,127,118,.1)}
.lab-rival:last-child{border-bottom:none}
.lab-rival-name{font-weight:600}
.lab-rival-stat{font-size:11px;color:#C42B2B;font-weight:600}

.neg-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.neg-tag{font-size:11px;padding:2px 7px;border-radius:3px;font-family:ui-monospace,monospace;background:rgba(196,43,43,.06);color:#C42B2B;border:1px solid rgba(196,43,43,.15)}

.divider{border:none;border-top:1px solid #F0F1F4;margin:14px 0}
.note-box{background:#FFFBEB;border:1px solid rgba(184,118,10,.25);border-radius:5px;padding:10px 12px;font-size:12px;color:#374151;margin-top:10px;line-height:1.6}
.note-box strong{color:#B8760A}
</style>

<!-- TOP BAR -->
<div class="top-bar">
  <div class="logo">Google Ads Funnel <span>TIER 1 DIAGNOSTIC</span></div>
  <div style="font-size:12px;color:#9CA3AF">Click a city · toggle SH/STI · click a stage to drill in</div>

<!-- CONTROLS -->

</div>

<div class="main" id="mainGrid">

  </div>
</div>

// ─── STATE ────────────────────────────────────────────────────────────────────
let currentCity = 'bangalore';
let currentCat = 'sh';
let activeStage = null;

// ─── RENDER ───────────────────────────────────────────────────────────────────
function getKey(){ return `${currentCity}-${currentCat}`; }
function getD(){ return DATA[getKey()]; }

function statusClass(s){ return s==='good'?'good':s==='warn'?'warn':'broken'; }
function statusLabel(s){ return s==='good'?'✓ Healthy':s==='warn'?'⚠ Watch':'✗ Breaking'; }
function statusSSClass(s){ return s==='good'?'ss-good':s==='warn'?'ss-warn':'ss-bad'; }
function metricColorClass(v, target, highGood){
  const ratio = highGood ? v/target : target/v;
  if(ratio >= 1) return 'sm-good';
  if(ratio >= 0.8) return 'sm-warn';
  return 'sm-bad';
}

const STAGE_META = {
  reach: {label:'Stage 1', name:'Reach', desc:'Impression Share', icon:'📡'},
  position: {label:'Stage 2', name:'Position', desc:'Absolute Top Rate', icon:'🎯'},
  engagement: {label:'Stage 3', name:'Engagement', desc:'Click-Through Rate', icon:'👆'},
  locLead: {label:'Stage 4', name:'Conversion', desc:'Location Click → Lead', icon:'📞'},
};

function renderFunnel(){
  const d = getD();
  if(!d){ document.getElementById('funnelCol').innerHTML='<div style="padding:20px;color:#999">No data</div>'; return; }

  // Verdict
  let html = `<div class="city-verdict">
    <div class="verdict-city">${d.city}</div>
    <div class="verdict-cat ${d.cat.toLowerCase()}">${d.cat}</div>
    <span class="verdict-badge ${d.verdictClass}">${d.verdict}</span>
    <div style="margin-top:8px;font-size:12px;color:#6B7280">
      Budget: ₹${d.budget.toLocaleString()}/day &nbsp;·&nbsp;
      CPL: ${d.cpl ? '₹'+d.cpl : '—'} &nbsp;·&nbsp;
      Optim: <span style="color:${d.optim>=70?'#15803D':d.optim>=60?'#C95A14':'#C42B2B'};font-weight:600">${d.optim}%</span>
      ${d.groups ? ` &nbsp;·&nbsp; Groups: <span style="color:${d.groups<=d.groupsTarget?'#15803D':'#C42B2B'};font-weight:600">${d.groups}</span> (target ${d.groupsTarget})` : ''}
    </div>
  </div>`;

  html += '<div class="funnel-stages">';

  const stageKeys = ['reach','position','engagement','locLead'];
  stageKeys.forEach((sk, i) => {
    const sm = STAGE_META[sk];
    const sd = d.stages[sk];
    const isActive = activeStage === sk;

    // Metric display
    let metricVal, metricTarget, metricHighGood = true, subText = '';
    if(sk==='reach'){
      metricVal = d.is; metricTarget = d.isTarget;
      subText = `Budget loss: ${d.isLostBudget}% &nbsp;·&nbsp; Rank loss: ${d.isLostRank}%`;
    } else if(sk==='position'){
      metricVal = d.absTop; metricTarget = d.absTopTarget;
      const topRival = d.absTopRivals[0];
      subText = topRival ? `${topRival.name}: ${topRival.val ? topRival.val+'%' : 'dominant'}` : '';
    } else if(sk==='engagement'){
      metricVal = d.ctr; metricTarget = d.ctrTarget;
      subText = `Target: ${d.ctrTarget}%+`;
    } else if(sk==='locLead'){
      metricVal = d.locLead; metricTarget = d.locLeadTarget;
      subText = `Target: ${d.locLeadTarget}%  ·  CPL: ${d.cpl ? '₹'+d.cpl : '—'}`;
    }

    const mClass = metricColorClass(metricVal, metricTarget, true);
    const sClass = statusClass(sd.status);
    const ssClass = statusSSClass(sd.status);

    // Mini bar for reach: show budget vs rank loss
    let miniBar = '';
    if(sk==='reach'){
      miniBar = `<div class="stage-mini-bars">
        <div class="mini-bar-item">
          <div class="mini-bar-label">IS (${d.is}% / ${d.isTarget}% target)</div>
          <div class="mini-bar-track"><div class="mini-bar-fill ${d.is>=d.isTarget?'mf-green':d.is>=d.isTarget*0.85?'mf-amber':'mf-red'}" style="width:${Math.min(100,d.is/d.isTarget*100)}%"></div></div>
        </div>
        <div class="mini-bar-item">
          <div class="mini-bar-label">Lost to budget (${d.isLostBudget}%)</div>
          <div class="mini-bar-track"><div class="mini-bar-fill ${d.isLostBudget>10?'mf-red':d.isLostBudget>6?'mf-amber':'mf-green'}" style="width:${Math.min(100,d.isLostBudget*4)}%"></div></div>
        </div>
        <div class="mini-bar-item">
          <div class="mini-bar-label">Lost to rank (${d.isLostRank}%)</div>
          <div class="mini-bar-track"><div class="mini-bar-fill ${d.isLostRank>35?'mf-red':d.isLostRank>20?'mf-amber':'mf-green'}" style="width:${Math.min(100,d.isLostRank*1.5)}%"></div></div>
        </div>
      </div>`;
    }

    html += `
    ${i>0?'<div class="stage-connector"></div>':''}
    <div class="stage-wrap">
      <div class="stage ${sClass}${isActive?' active':''}" onclick="selectStage('${sk}')">
        <div class="stage-header">
          <div class="stage-left">
            <div class="stage-num">${sm.icon} ${sm.label} · ${sm.name}</div>
            <div class="stage-name">${sm.desc}</div>
            <div class="stage-metric ${mClass}">${metricVal}%</div>
            ${subText?`<div class="stage-sub">${subText}</div>`:''}
          </div>
          <div class="stage-status ${ssClass}">${statusLabel(sd.status)}</div>
        </div>
        ${miniBar}
      </div>
    </div>`;
  });

  html += '</div>';
  document.getElementById('funnelCol').innerHTML = html;
}

function selectStage(sk){
  activeStage = sk;
  renderFunnel();
  renderDetail(sk);
}

function renderDetail(sk){
  const d = getD();
  const sd = d.stages[sk];
  const sm = STAGE_META[sk];
  if(!sd) return;

  let html = `<div class="detail-header">
    <div class="dh-stage">${sm.icon} ${sm.label} · ${sm.name}</div>
    <div class="dh-title">${sm.desc} — ${d.city} ${d.cat}</div>
    <div class="dh-status">Status: <strong style="color:${sd.status==='good'?'#15803D':sd.status==='warn'?'#C95A14':'#C42B2B'}">${statusLabel(sd.status)}</strong></div>
  </div><div class="detail-body">`;

  // Lab problem callout (STI position stage)
  if(sd.labProblem && sk==='position'){
    html += `<div class="lab-box"><div class="lab-box-label">The Diagnostic Lab Problem</div>
    <p style="font-size:12px;color:#374151;margin-bottom:10px;line-height:1.5">Competitors winning abs top are <strong>home testing labs</strong>, not treatment clinics. They dominate queries like "STD test", "STD blood test near me", "HIV testing". Our landing pages are treatment clinics — we cannot win these queries on QS or relevance. The fix is to exit the testing auction, not to bid harder.</p>
    <div class="lab-rivals">`;
    d.absTopRivals.forEach(r => {
      html += `<div class="lab-rival">
        <span class="lab-rival-name">${r.name}</span>
        <span style="font-size:11px;color:#6B7280">${r.note}</span>
        ${r.val?`<span class="lab-rival-stat">Abs top: ${r.val}%</span>`:r.posAbove?`<span class="lab-rival-stat">Above us: ${r.posAbove}%</span>`:''}
      </div>`;
    });
    html += '</div></div>';
  }

  // Decision levers
  html += `<div class="decision-block">
    <div class="db-question">Which lever works here — and why?</div>`;

  sd.levers.forEach(l => {
    const ynClass = l.yn==='no'?'lever-no':l.yn==='yes'||l.yn.startsWith('yes')?'lever-yes':'';
    const ynLabel = l.yn;
    html += `<div class="lever-row">
      <div class="lever-icon">${l.icon}</div>
      <div class="lever-body">
        <div class="lever-name">${l.name} <span class="lever-yn ${ynClass}">${ynLabel}</span></div>
        <div class="lever-why">${l.why}</div>
      </div>
    </div>`;
  });
  html += '</div>';

  // Actions
  if(sd.actions && sd.actions.length){
    html += `<div class="decision-block">
      <div class="db-question">Specific actions</div>
      <ul class="action-list">`;
    sd.actions.forEach(a => { html += `<li>${a}</li>`; });
    html += '</ul></div>';
  }

  // Review gaps (locLead stage)
  if(sk==='locLead' && d.reviewGaps && d.reviewGaps.length){
    html += `<div class="decision-block">
      <div class="db-question">Review gap by clinic</div>
      <div class="review-block">
        <div class="rb-header" style="grid-template-columns:120px 1fr 1fr">
          <span>Clinic</span><span>Allo reviews</span><span>Rival reviews</span>
        </div>`;
    d.reviewGaps.forEach(r => {
      const ratio = r.ours / r.them;
      const gapClass = ratio < 0.1 ? 'gap-crit' : ratio < 0.4 ? 'gap-high' : 'gap-ok';
      const gapLabel = ratio < 0.1 ? 'Critical' : ratio < 0.4 ? 'High' : 'Manageable';
      const ourPct = Math.max(4, Math.min(100, (r.ours / Math.max(r.ours, r.them)) * 100));
      const themPct = Math.max(4, Math.min(100, (r.them / Math.max(r.ours, r.them)) * 100));
      html += `<div class="rb-row">
        <div class="rb-clinic">${r.clinic}</div>
        <div class="rb-bar">
          <div class="rb-fill mf-blue" style="width:${ourPct}px;background:#1D60B5"></div>
          <span class="rb-num">${r.ours} ours</span>
        </div>
        <div class="rb-bar">
          <div class="rb-fill" style="width:${themPct}px;background:#E0E4ED"></div>
          <span class="rb-num">${r.them} (${r.rival}) &nbsp;<span class="rb-gap ${gapClass}">${gapLabel}</span></span>
        </div>
      </div>`;
    });
    html += '</div></div>';

    // PRM brief
    if(d.prmRival && d.prmThemes.length){
      html += `<div class="prm-box">
        <div class="prm-box-label">PRM Brief — what to solicit</div>
        <p style="font-size:12px;color:#374151;margin-bottom:8px">Rival: <strong>${d.prmRival}</strong></p>
        <div class="prm-themes">`;
      d.prmThemes.forEach(t => { html += `<span class="prm-theme">${t}</span>`; });
      html += `</div>
        <ul class="prm-prompts">`;
      d.prmPrompts.forEach(p => { html += `<li>"${p}"</li>`; });
      html += `</ul></div>`;
    }
  }

  // Negatives (STI position stage)
  if(sk==='position' && d.labProblem){
    html += `<div class="decision-block">
      <div class="db-question">Negatives to add now</div>
      <div class="neg-list">
        ${['STD test','STD testing','STD blood test','STI test','HIV test','HIV testing','test at home','test price','test cost','diagnostic','lab near me','report','same day result','urine test','swab test','free HIV test','STD kit','home collection','test package'].map(t=>`<span class="neg-tag">${t}</span>`).join('')}
      </div>
      <p style="font-size:11px;color:#9CA3AF;margin-top:8px">Add as shared negative list → apply to all STI campaigns simultaneously</p>
    </div>`;
  }

  html += '</div>';
  document.getElementById('detailCol').innerHTML = `<div class="detail-panel">${html}</div>`;
}

// ─── CONTROLS ─────────────────────────────────────────────────────────────────
function setCity(city){
  currentCity = city;
  activeStage = null;
  document.querySelectorAll('.city-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.city === city);
  });
  renderFunnel();
  document.getElementById('detailCol').innerHTML = `<div class="detail-panel"><div class="detail-empty"><div style="font-size:28px">↙</div><div>Click a funnel stage to drill in</div></div></div>`;
}

function setCat(cat){
  currentCat = cat;
  activeStage = null;
  document.getElementById('catSH').className = 'cat-btn' + (cat==='sh'?' active-sh':'');
  document.getElementById('catSTI').className = 'cat-btn' + (cat==='sti'?' active-sti':'');
  renderFunnel();
  document.getElementById('detailCol').innerHTML = `<div class="detail-panel"><div class="detail-empty"><div style="font-size:28px">↙</div><div>Click a funnel stage to drill in</div></div></div>`;
}

document.getElementById('cityTabs').addEventListener('click', e => {
  const tab = e.target.closest('.city-tab');
  if(tab) setCity(tab.dataset.city);
});

// Initial render
renderFunnel();

// Auto-select first broken stage
setTimeout(()=>{
  const d = getD();
  if(!d) return;
  const broken = Object.entries(d.stages).find(([,v])=>v.status==='broken'||v.status==='warn');
  if(broken) selectStage(broken[0]);
},100);
</script>
