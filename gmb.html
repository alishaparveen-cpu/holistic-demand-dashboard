<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>GMB · Action Board</title>
<style>
:root{--accent:#2C6CAE;--ink:#1f2733;--muted:#6b7580;--line:#e6e9ee;--bg:#f6f7f9;--card:#fff;
      --pos:#2E7D5B;--neg:#B8503C;--amber:#C9862A;--impr:#3E7CB1;--rev:#8257C4;
      --r1:#c0392b;--r2:#d98324;--r3:#c9a227;}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
a{color:var(--accent);text-decoration:none}
.wrap{max-width:1120px;margin:0 auto;padding:18px 20px 60px}
header.top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
header.top h1{font-size:20px;margin:0;font-weight:700}
.sub{color:var(--muted);font-size:12.5px}
.nav{margin:2px 0 14px;font-size:12.5px}
.nav a{margin-right:14px;color:var(--muted)}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);
          border-radius:10px;padding:10px 12px;margin-bottom:16px;position:sticky;top:0;z-index:5}
.controls label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-right:5px}
select,button.seg{font:13px inherit;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:5px 9px;background:#fff}
.seg{cursor:pointer}.seg.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.wkflag{font-size:11.5px;color:var(--amber)}
/* lever cards (also act as filters) */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:10px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 13px;cursor:pointer;transition:border-color .12s,box-shadow .12s}
.card:hover{border-color:var(--accent)}
.card.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,#fff)}
.card .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:5px}
.card .v{font-size:22px;font-weight:700;margin-top:4px}
.card .fl{font-size:12px;margin-top:3px;font-weight:600}
.card .d{font-size:11.5px;margin-top:1px;color:var(--muted)}
.up{color:var(--pos)}.down{color:var(--neg)}.flat{color:var(--muted)}
.badcnt{color:var(--neg)}.goodcnt{color:var(--pos)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 8px 6px;margin-bottom:18px}
.sec .hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:8px 10px 6px}
.sec h2{font-size:15px;margin:0;font-weight:700}
.sec .h-sub{font-size:12px;color:var(--muted)}
/* action rows */
.arow{display:grid;grid-template-columns:22px 1fr auto;gap:11px;align-items:start;padding:11px 12px;border-top:1px solid var(--line);cursor:pointer}
.arow:first-of-type{border-top:none}
.arow:hover{background:#fafbfc}
.dot{width:11px;height:11px;border-radius:50%;margin-top:4px}
.d1{background:var(--r1)}.d2{background:var(--r2)}.d3{background:var(--r3)}
.arow .who{font-weight:700;font-size:13.5px}
.arow .who .city{color:var(--muted);font-weight:500;font-size:12px}
.lvbadge{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:1px 7px;border-radius:9px;margin-left:7px;vertical-align:middle}
.arow .head{font-size:13px;margin-top:3px}
.arow .head b{font-weight:700}
.arow .fix{font-size:12.5px;color:#4a5560;margin-top:3px}
.arow .fix .lab{color:var(--pos);font-weight:700;margin-right:4px}
.arow .rt{text-align:right;white-space:nowrap}
.arow .spark{opacity:.9}
.arow .metanum{font-size:16px;font-weight:700}
.arow .metasub{font-size:10.5px;color:var(--muted)}
.exp{grid-column:1/-1;margin-top:9px;padding:10px 12px;background:#fbfcfd;border:1px solid var(--line);border-radius:9px}
.rev{border-left:3px solid var(--neg);padding:5px 10px;margin:7px 0;background:#fff;border-radius:0 7px 7px 0}
.rev .meta{font-size:11px;color:var(--muted)}
.rev .txt{font-size:12.5px;margin-top:2px}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:0 6px;border-radius:8px;margin-left:6px}
.tag.open{background:#fdecea;color:var(--neg)}.tag.done{background:#e8f3ec;color:var(--pos)}
.zbtn{font:11.5px inherit;border:1px solid var(--line);background:#fff;color:var(--accent);border-radius:7px;padding:3px 10px;cursor:pointer;font-weight:600;margin-top:8px}
.empty{padding:26px 14px;text-align:center;color:var(--muted);font-size:13px}
.note{background:#fbf7ee;border:1px solid #efe3c8;border-radius:9px;padding:10px 13px;font-size:12.5px;color:#7a6a3f;margin-bottom:14px}
svg{display:block}
.ml{font-size:10px}
/* chart modal (ported) */
.cmodal{position:fixed;inset:0;background:rgba(20,28,36,.5);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.cmodal.on{display:flex}
.cbox{position:relative;background:var(--card);border-radius:14px;padding:18px 22px 20px;max-width:780px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.32)}
.cbox h3{margin:0 4px 2px 0;font-size:17px;color:var(--ink)}
.cbox .csub{font-size:11.5px;color:var(--muted);margin-bottom:8px}
.cx{position:absolute;top:12px;right:16px;border:none;background:none;font-size:19px;color:var(--muted);cursor:pointer;line-height:1}
/* ask widget */
#askLaunch{position:fixed;bottom:20px;right:20px;z-index:55;background:var(--accent);color:#fff;border:0;border-radius:26px;padding:11px 18px;font:14px inherit;font-weight:600;cursor:pointer;box-shadow:0 6px 20px rgba(44,108,174,.4);display:flex;align-items:center;gap:7px}
#askPanel{position:fixed;bottom:20px;right:20px;z-index:56;width:390px;max-width:calc(100vw - 32px);height:560px;max-height:calc(100vh - 40px);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.28);display:none;flex-direction:column;overflow:hidden}
#askPanel.on{display:flex}
.askhead{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--accent) 6%,var(--card))}
.askhead b{font-size:14px}.askhead .sm{font-size:11px;color:var(--muted)}
.askhead .x{margin-left:auto;cursor:pointer;color:var(--muted);font-size:18px;border:0;background:none}
.askhead .gear{cursor:pointer;color:var(--muted);font-size:14px;border:0;background:none}
#askMsgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.amsg{max-width:88%;padding:8px 11px;border-radius:11px;font-size:13px;line-height:1.5;white-space:pre-wrap}
.amsg.u{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:3px}
.amsg.a{align-self:flex-start;background:#f1f4f8;color:var(--ink);border-bottom-left-radius:3px}
.amsg.sys{align-self:center;background:#fbf7ee;color:#7a6a3f;font-size:11.5px;border:1px solid #efe3c8}
.askform{display:flex;gap:7px;padding:11px;border-top:1px solid var(--line)}
.askform textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:13px inherit;height:38px;max-height:110px}
.askform button{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:0 14px;font-weight:600;cursor:pointer}
.askform button:disabled{opacity:.5;cursor:default}
.asksug{display:flex;flex-wrap:wrap;gap:6px;padding:0 11px 8px}
.asksug span{font-size:11px;border:1px solid var(--line);border-radius:12px;padding:3px 9px;cursor:pointer;color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>📍 GMB · Action Board</h1>
    <span class="sub" id="scopeSub"></span>
  </header>
  <div class="nav">
    <a href="bookings-funnel.html">← Demand view</a>
    <a href="google-ads.html">Google Ads</a>
    <a href="comp-intelligence.html">Competition</a>
  </div>

  <div class="controls">
    <span><label>Scope</label><select id="cityS"></select></span>
    <span><label>Clinic</label><select id="clinS"></select></span>
    <span><label>Category</label>
      <button class="seg on" data-cat="ALL">All</button>
      <button class="seg" data-cat="SH">SH</button>
      <button class="seg" data-cat="STI">STI</button>
      <button class="seg" data-cat="MH">MH</button>
    </span>
    <span style="margin-left:auto" class="wkflag" id="wkflag"></span>
  </div>

  <div class="note" id="lagNote"></div>

  <!-- ① Levers at a glance — click one to filter the board to it -->
  <div class="cards" id="cards"></div>

  <!-- ② The action board -->
  <div class="sec">
    <div class="hd">
      <h2 id="boardTitle">Fix these first</h2>
      <span class="h-sub" id="boardSub"></span>
    </div>
    <div id="board"></div>
  </div>

  <p class="sub" id="foot"></p>
</div>

<div class="cmodal" id="cmodal"><div class="cbox">
  <button class="cx" id="cx">✕</button>
  <h3 id="ctitle"></h3><div class="csub" id="csub"></div>
  <div id="cchart" style="overflow-x:auto"></div>
</div></div>

<button id="askLaunch">💬 Ask the dashboard</button>
<div id="askPanel">
  <div class="askhead"><b>📍 GMB copilot</b><span class="sm">Claude · your data</span>
    <button class="gear" id="askGear" title="change API key">⚙</button>
    <button class="x" id="askClose">✕</button></div>
  <div id="askMsgs"></div>
  <div class="asksug" id="askSug"></div>
  <form class="askform" id="askForm">
    <textarea id="askInput" placeholder="Ask… e.g. which clinics need review help?" rows="1"></textarea>
    <button type="submit" id="askSend">➤</button>
  </form>
</div>

<script>
let DATA=null, NEG=null, CAT='ALL', SCOPE={type:'national'}, LFILTER='all', I0=1, EXP=new Set();
const $=id=>document.getElementById(id);
const F=n=>n==null?'—':Math.round(n).toLocaleString('en-IN');
const pct=(n,b)=>b?Math.round((n-b)/b*100):null;

function node(){
  if(SCOPE.type==='clinic') return DATA.clinics[SCOPE.key];
  if(SCOPE.type==='city')   return DATA.cities[SCOPE.key];
  return DATA.national;
}
// clinic keys in the current scope
function scopeClinics(){
  if(SCOPE.type==='clinic') return [SCOPE.key];
  if(SCOPE.type==='city')   return Object.keys(DATA.clinics).filter(k=>k.split('|')[0]===SCOPE.key);
  return Object.keys(DATA.clinics);
}
// latest fully-settled week. GBP zero-fills the trailing days but still REPORTS 7 (so days>=7 is
// unreliable) — detect the partial-week collapse by impressions: a week is immature if its
// impressions are well below the following 4-week average.
function matureIdx(nd){
  const a=nd.impr||[];
  for(let i=0;i<a.length;i++){
    let s=0,c=0; for(let k=i+1;k<=i+4&&k<a.length;k++){ if(a[k]!=null){s+=a[k];c++;} }
    const b=c?s/c:0;
    if((a[i]||0)>0 && (b===0 || a[i]>=0.6*b)) return i;   // ≥60% of the recent norm ⇒ settled
  }
  return 1;
}
const leadsArr=nd=>(nd.gmb_call||[]).map((v,i)=>(v||0)+((nd.gmb_wa||[])[i]||0)+((nd.gmb_web||[])[i]||0));
const at=(a,i)=>(a&&a[i]!=null)?a[i]:0;
function base4(a){let s=0,c=0;for(let k=I0+1;k<=I0+4&&k<a.length;k++){if(a[k]!=null){s+=a[k];c++;}}return c?s/c:null;}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function wkRange(mon){const d=new Date(mon+'T00:00:00'),e=new Date(d);e.setDate(d.getDate()+6);
  return MON[d.getMonth()]+' '+d.getDate()+'–'+(d.getMonth()===e.getMonth()?e.getDate():MON[e.getMonth()]+' '+e.getDate());}

// ── lever catalogue ──
const LEVERS={
  neg:  {lab:'Negative ★',     full:'Negative reviews', col:'var(--neg)',  icon:'★'},
  vel:  {lab:'Review pace',    full:'Review velocity',  col:'var(--rev)',  icon:'✎'},
  rival:{lab:'Rival gap',      full:'Rival review gap', col:'var(--amber)',icon:'⚔'},
  actr: {lab:'Action rate',    full:'Action rate',      col:'var(--impr)', icon:'☝'},
  leads:{lab:'GMB leads',      full:'GMB leads',        col:'var(--accent)',icon:'◎'},
};
const LORDER=['neg','leads','vel','actr','rival'];

// recent ≤2★ reviews for a clinic (last ~45 days from the settled week), newest first
function recentNegs(key){
  const list=(NEG&&NEG[key])||[]; if(!list.length) return [];
  const settled=new Date(DATA._meta.weeks[I0]+'T00:00:00'); settled.setDate(settled.getDate()+7);
  const cut=new Date(settled); cut.setDate(cut.getDate()-45);
  return list.filter(r=>r.rating<=2 && new Date(r.dt+'T00:00:00')>=cut)
             .sort((a,b)=>b.dt<a.dt?-1:1);
}

// compute every flag for one clinic node (key = "City|Loc"); returns [{lever,sev,priority,head,fix,arr,col,meta,metasub}]
function flagsFor(key){
  const nd=DATA.clinics[key]; if(!nd) return [];
  const cat = CAT==='ALL'?'SH':CAT, out=[];
  const rn=at(nd.rev_n,I0), rnb=base4(nd.rev_n);
  const im=at(nd.impr,I0), imb=base4(nd.impr), ia=at(nd.interactions,I0), iab=base4(nd.interactions);
  const lArr=leadsArr(nd), ln=at(lArr,I0), lb=base4(lArr);
  // 1) NEGATIVE reviews (unanswered ≤2★) — highest priority
  const negs=recentNegs(key), open=negs.filter(r=>!r.replied).length;
  if(negs.length){ const sev=open>0?3:2;
    out.push({lever:'neg',sev,priority:(open>0?5000+open*100:2400)+negs.length,   // unanswered ≤2★ = top fire; all-replied = mid-tier (informational)
      head:`<b>${negs.length}</b> new ≤2★ review${negs.length>1?'s':''} <span style="color:var(--muted)">(last 45d)</span>${open?` · <b style="color:var(--neg)">${open} unanswered</b>`:''}`,
      fix:'Reply publicly to each & fix the issue offline — unanswered 1★s are the fastest way to sink the rating.',
      arr:nd.rev_neg,col:'var(--neg)',meta:open||negs.length,metasub:open?'to reply':'to recover',negs}); }
  // 2) GMB LEADS drop (our real-time signal, no GBP lag)
  if(lb!=null&&lb>=5&&ln<lb*0.75){ const dr=pct(ln,lb),sev=dr<=-40?3:2;
    out.push({lever:'leads',sev,priority:3200+(-dr)+lb,
      head:`GMB leads <b class="down">↓ ${Math.abs(dr)}%</b> · ${Math.round(lb)}→${ln}/wk`,
      fix:'Leads fell with no listing change — check the profile phone/CTA and the call answer-rate.',
      arr:lArr,col:'var(--accent)',meta:ln,metasub:`was ${Math.round(lb)}/wk`}); }
  // 3) REVIEW velocity drop
  if(rnb!=null&&rnb>=2&&rn<rnb*0.7){ const dr=pct(rn,rnb),sev=dr<=-50?3:2;
    out.push({lever:'vel',sev,priority:2600+(-dr)+rnb,
      head:`Review pace <b class="down">↓ ${Math.abs(dr)}%</b> · ${rnb.toFixed(1)}→${rn}/wk`,
      fix:`Ask every done patient for a Google review — you're at ${rn}/wk vs ${rnb.toFixed(1)} before. A QR at checkout lifts this fastest.`,
      arr:nd.rev_n,col:'var(--rev)',meta:rn,metasub:`was ${rnb.toFixed(1)}/wk`}); }
  // 4) ACTION rate drop (are people who see the listing acting?)
  if(imb&&iab&&im>0){ const arN=ia/im, arB=iab/imb;
    if(arB>0&&arN<arB*0.8&&imb>=80){ const dr=pct(arN,arB),sev=dr<=-35?3:2, steady=Math.abs(pct(im,imb)||0)<12;
      out.push({lever:'actr',sev,priority:1500+(-dr),
        head:`Action rate <b class="down">↓ ${Math.abs(dr)}%</b> · ${(arB*100).toFixed(1)}%→${(arN*100).toFixed(1)}%`,
        fix: steady?`Listing is still seen (${F(im)} impressions) but fewer act — refresh photos, sharpen the description, add a post/offer.`
                   :'Impressions & actions both down — check profile health: hours, categories, fresh photos/posts.',
        arr:nd.interactions,col:'var(--impr)',meta:(arN*100).toFixed(1)+'%',metasub:`was ${(arB*100).toFixed(1)}%`}); } }
  // 5) RIVAL review gap (standing / strategic)
  const r=(nd.rival||{})[cat];
  if(r&&r.top_reviews-r.our_reviews>=40){ const gap=r.top_reviews-r.our_reviews, perWk=Math.max(1,Math.ceil(gap/12)), sev=gap>=250?2:1;
    out.push({lever:'rival',sev,priority:600+Math.min(gap,600)/2,
      head:`Behind <b>${r.top_name||'#1 rival'}</b> by <b>${F(gap)}</b> reviews <span style="color:var(--muted)">(${cat})</span>`,
      fix:`Close the gap — +${perWk}/wk overtakes within a quarter.${r.top_maps?' ▸ open the rival in Maps to see what they do.':''}`,
      arr:nd.rev_n,col:'var(--amber)',meta:'−'+F(gap),metasub:r.our_reviews+' vs '+r.top_reviews,rmaps:r.top_maps}); }
  return out.sort((a,b)=>b.priority-a.priority);
}

// spark: last 8 weeks ending at the settled week, oldest→right
function spark(arr,col){
  const s=[]; for(let k=I0+7;k>=I0;k--) s.push(at(arr,k));
  const mx=Math.max(1,...s),bw=6,gap=2,H=22; let b='';
  s.forEach((v,p)=>{const hh=Math.round(v/mx*(H-3)),last=p===s.length-1;
    b+=`<rect x="${p*(bw+gap)}" y="${H-hh}" width="${bw}" height="${hh}" fill="${col}" opacity="${last?1:.4}"/>`;});
  return `<svg width="${s.length*(bw+gap)}" height="${H}">${b}</svg>`;
}

function renderCards(){
  const clinics=scopeClinics();
  // per-lever: count of clinics flagged
  const cnt={}; LORDER.forEach(l=>cnt[l]=0);
  clinics.forEach(k=>{const seen=new Set(); flagsFor(k).forEach(f=>{if(!seen.has(f.lever)){seen.add(f.lever);cnt[f.lever]++;}});});
  const nd=node();
  // scope aggregate Δ per lever for the sub-line
  const agg=l=>{
    if(l==='vel'){const a=nd.rev_n,n=at(a,I0),b=base4(a);return b?`${Math.round(b)}→${n}/wk`:`${n}/wk`;}
    if(l==='leads'){const a=leadsArr(nd),n=at(a,I0),b=base4(a);return b?`${Math.round(b)}→${n}/wk`:`${n}/wk`;}
    if(l==='actr'){const arN=at(nd.interactions,I0)/Math.max(1,at(nd.impr,I0));return (arN*100).toFixed(1)+'% act';}
    if(l==='neg'){let t=0;clinics.forEach(k=>t+=recentNegs(k).filter(r=>!r.replied).length);return t+' unanswered';}
    if(l==='rival'){const cat=CAT==='ALL'?'SH':CAT;let lead=0,tot=0;clinics.forEach(k=>{const r=(DATA.clinics[k].rival||{})[cat];if(r){tot++;if(r.our_reviews>=r.top_reviews)lead++;}});return `lead ${lead}/${tot}`;}
  };
  const allCard=`<div class="card ${LFILTER==='all'?'on':''}" data-l="all">
    <div class="k">▤ All levers</div><div class="v">${clinics.reduce((s,k)=>s+(flagsFor(k).length?1:0),0)}</div>
    <div class="fl">clinics to act on</div><div class="d">of ${clinics.length} in scope</div></div>`;
  const cards=LORDER.map(l=>{const L=LEVERS[l],c=cnt[l];
    return `<div class="card ${LFILTER===l?'on':''}" data-l="${l}">
      <div class="k">${L.icon} ${L.full}</div>
      <div class="v ${c?'badcnt':'goodcnt'}">${c}</div>
      <div class="fl" style="color:${c?'var(--neg)':'var(--pos)'}">${c?'need attention':'all good'}</div>
      <div class="d">${agg(l)||''}</div></div>`;}).join('');
  $('cards').innerHTML=allCard+cards;
  $('cards').querySelectorAll('.card').forEach(el=>el.onclick=()=>{LFILTER=el.dataset.l;render();});
}

function renderBoard(){
  const clinics=scopeClinics();
  let rows=[];
  clinics.forEach(k=>{const fl=flagsFor(k); if(!fl.length) return;
    if(LFILTER==='all'){ rows.push({key:k,f:fl[0]}); }
    else { const m=fl.find(f=>f.lever===LFILTER); if(m) rows.push({key:k,f:m}); }
  });
  rows.sort((a,b)=>b.f.priority-a.f.priority);
  const Lname=LFILTER==='all'?'worst issue per clinic':LEVERS[LFILTER].full;
  $('boardTitle').textContent = LFILTER==='all'?'Fix these first':LEVERS[LFILTER].full;
  $('boardSub').innerHTML = `${rows.length} clinic${rows.length!==1?'s':''} · ${Lname} · ranked by impact · as of <b>${wkRange(DATA._meta.weeks[I0])}</b> (settled)`;
  if(!rows.length){ $('board').innerHTML=`<div class="empty">✅ Nothing flagged on <b>${Lname}</b> in this scope. ${LFILTER!=='all'?'Try “All levers”.':''}</div>`; return; }
  const dcls=s=>s>=3?'d1':s>=2?'d2':'d3';
  let h='';
  rows.forEach(({key,f})=>{
    const city=key.split('|')[0],loc=key.split('|')[1],eid=key+'|'+f.lever,isOpen=EXP.has(eid),L=LEVERS[f.lever];
    h+=`<div class="arow" data-e="${eid}">
      <div class="dot ${dcls(f.sev)}"></div>
      <div>
        <div class="who">${loc} <span class="city">· ${city}</span>
          <span class="lvbadge" style="background:color-mix(in srgb,${L.col} 15%,#fff);color:${L.col}">${L.icon} ${L.lab}</span></div>
        <div class="head">${f.head}</div>
        <div class="fix"><span class="lab">FIX</span>${f.fix}</div>
        ${isOpen?expandHTML(key,f):''}
      </div>
      <div class="rt">
        <div class="metanum" style="color:${L.col}">${f.meta}</div>
        <div class="metasub">${f.metasub||''}</div>
        <div class="spark">${spark(f.arr,L.col)}</div>
      </div>
    </div>`;
  });
  $('board').innerHTML=h;
  $('board').querySelectorAll('.arow').forEach(el=>el.onclick=e=>{
    if(e.target.closest('a')||e.target.closest('.zbtn')) return;
    const k=el.dataset.e; EXP.has(k)?EXP.delete(k):EXP.add(k); renderBoard();
  });
  $('board').querySelectorAll('.zbtn[data-arr]').forEach(el=>el.onclick=ev=>{ev.stopPropagation();
    openChart(el.dataset.t,JSON.parse(el.dataset.arr),el.dataset.col);});
}
function expandHTML(key,f){
  if(f.lever==='neg'){
    const negs=(f.negs||[]).slice(0,6);
    return `<div class="exp"><b style="font-size:12px">Reviews to respond to</b>`+negs.map(r=>
      `<div class="rev"><div class="meta">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)} · ${r.author||'Anonymous'} · ${r.dt}
        <span class="tag ${r.replied?'done':'open'}">${r.replied?'replied':'NOT replied'}</span></div>
        <div class="txt">${(r.txt||'').replace(/</g,'&lt;')}</div></div>`).join('')+`</div>`;
  }
  const btns=`<button class="zbtn" data-arr='${JSON.stringify(f.arr||[])}' data-t="${(key.split('|')[1])+' · '+LEVERS[f.lever].full}" data-col="${LEVERS[f.lever].col}">▸ open full trend</button>`;
  const maps=f.rmaps?` <a href="${f.rmaps}" target="_blank" rel="noopener" class="zbtn" style="text-decoration:none">↗ rival in Maps</a>`:'';
  return `<div class="exp"><div style="font-size:12px;color:var(--muted)">8-week trend on the right · click to see the full history.</div>${btns}${maps}</div>`;
}

function render(){
  I0=matureIdx(DATA.national);
  $('scopeSub').textContent = SCOPE.type==='national'?'All India · '+Object.keys(DATA.clinics).length+' clinics'
    : SCOPE.type==='city'?SCOPE.key : SCOPE.key.split('|')[0]+' · '+SCOPE.key.split('|')[1];
  $('wkflag').textContent='Settled week: '+wkRange(DATA._meta.weeks[I0])+(I0>0?' · '+wkRange(DATA._meta.weeks[0])+' still reporting':'');
  $('lagNote').innerHTML = I0>0
    ? `⏳ Google's Business Profile data finalises over ~a week, so the newest week (<b>${wkRange(DATA._meta.weeks[0])}</b>) is still filling in — the board judges the last <b>settled</b> week (${wkRange(DATA._meta.weeks[I0])}) so it never flags a false "drop". Reviews & GMB-leads come from our own data and aren't lagged.`
    : `Comparing the latest week vs its prior 4-week average.`;
  renderCards(); renderBoard();
}

function initControls(){
  const cities=Object.keys(DATA.cities).sort();
  $('cityS').innerHTML='<option value="__nat">All India</option>'+cities.map(c=>`<option value="${c}">${c}</option>`).join('');
  const fillClin=(city)=>{const ks=Object.keys(DATA.clinics).filter(k=>city==='__nat'||k.split('|')[0]===city).sort();
    $('clinS').innerHTML='<option value="__all">— all clinics —</option>'+ks.map(k=>`<option value="${k}">${k.split('|')[1]}</option>`).join('');};
  fillClin('__nat');
  $('cityS').onchange=e=>{const c=e.target.value;fillClin(c);EXP.clear();
    SCOPE=c==='__nat'?{type:'national'}:{type:'city',key:c};render();};
  $('clinS').onchange=e=>{const k=e.target.value;EXP.clear();
    if(k==='__all'){const c=$('cityS').value;SCOPE=c==='__nat'?{type:'national'}:{type:'city',key:c};}
    else SCOPE={type:'clinic',key:k};render();};
  document.querySelectorAll('.seg[data-cat]').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.seg[data-cat]').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');CAT=b.dataset.cat;render();});
  $('cx').onclick=()=>$('cmodal').classList.remove('on');
  $('cmodal').onclick=e=>{if(e.target.id==='cmodal')$('cmodal').classList.remove('on');};
  document.addEventListener('keydown',e=>{if(e.key==='Escape')$('cmodal').classList.remove('on');});
}

// ── chart modal (simple line, arrays newest-first) ──
function openChart(title,arr,col){
  col=col||'var(--accent)'; $('ctitle').textContent=title;
  const WK=DATA._meta.weeks, V=[],L=[]; for(let i=WK.length-1;i>=0;i--){V.push(arr[i]||0);L.push(wkRange(WK[i]));}
  const W=720,H=280,pad=40,padT=22,n=V.length,mx=Math.max(1,...V),hi=mx*1.15;
  const x=i=>pad+i*(W-2*pad)/((n-1)||1),y=v=>H-pad-(v/hi)*(H-pad-padT);
  let p='',pts='',lb='',prev=null;
  V.forEach((v,i)=>{if(prev)p+=`<line x1="${x(prev.i)}" y1="${y(prev.v)}" x2="${x(i)}" y2="${y(v)}" stroke="${col}" stroke-width="2.2"/>`;prev={i,v};
    pts+=`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${col}"><title>${L[i]}: ${F(v)}</title></circle>`;
    if(i%Math.ceil(n/12||1)===0||i===n-1)lb+=`<text x="${x(i)}" y="${H-8}" font-size="9" fill="var(--muted)" text-anchor="middle">${L[i].split('–')[0]}</text>`;});
  const i0d=n-1-I0; let mk=''; if(i0d>=0&&i0d<n)mk=`<line x1="${x(i0d)}" y1="${padT}" x2="${x(i0d)}" y2="${H-pad}" stroke="var(--amber)" stroke-dasharray="4 3" opacity=".6"/><text x="${x(i0d)}" y="${padT-6}" font-size="9" fill="var(--amber)" text-anchor="middle">settled</text>`;
  $('csub').textContent='oldest → newest · '+n+' weeks';
  $('cchart').innerHTML=`<svg width="100%" viewBox="0 0 ${W} ${H}">${mk}${p}${pts}${lb}</svg>`;
  $('cmodal').classList.add('on');
}

// ── ask widget ──
const ASK_KEY_LS='allo_anthropic_key', ASK_MODEL='claude-sonnet-5'; let ASK_HIST=[];
const askKey=()=>localStorage.getItem(ASK_KEY_LS)||'';
function askSetKey(){const k=prompt('Paste your Anthropic API key (sk-ant-…). Stored ONLY in this browser.',askKey());if(k!==null){localStorage.setItem(ASK_KEY_LS,k.trim());return k.trim();}return askKey();}
function askAdd(role,t){const d=document.createElement('div');d.className='amsg '+(role==='user'?'u':role==='sys'?'sys':'a');d.textContent=t;$('askMsgs').appendChild(d);$('askMsgs').scrollTop=1e9;return d;}
function askContext(){
  const clinics=scopeClinics(), board=[];
  clinics.forEach(k=>{const fl=flagsFor(k);if(fl.length)board.push({clinic:k,top_issue:fl[0].lever,detail:fl[0].head.replace(/<[^>]+>/g,''),fix:fl[0].fix,all_issues:fl.map(f=>f.lever)});});
  board.sort((a,b)=>0);
  return {settled_week:DATA._meta.weeks[I0],newest_week_still_reporting:DATA._meta.weeks[0],
    scope:SCOPE.type==='national'?'All India':SCOPE.key,category:CAT,
    levers:'neg=unanswered negative reviews, vel=review velocity drop, leads=GMB lead drop, actr=action-rate drop, rival=behind #1 map-pack rival',
    flagged_clinics:board.slice(0,60)};
}
const ASK_SYS=`You are the action copilot on Allo Health's GMB Action Board. Each clinic is flagged on its worst controllable lever with a concrete fix. Answer ONLY from the DATA JSON (flagged_clinics + the lever legend). Be specific: name clinics, the issue, and the fix. The board already excludes Google's still-reporting newest week, so never call the latest-week impressions dip a real drop. Keep it short and action-first.`;
async function askSend(q){let key=askKey();if(!key){key=askSetKey();if(!key){askAdd('sys','No API key set — click ⚙.');return;}}
  askAdd('user',q);ASK_HIST.push({role:'user',content:q});const wait=askAdd('assistant','…');$('askSend').disabled=true;
  try{const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
    headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:ASK_MODEL,max_tokens:1024,system:ASK_SYS+'\n\nDATA:\n'+JSON.stringify(askContext()),messages:ASK_HIST})});
    if(!res.ok){const t=await res.text();wait.textContent=res.status===401?'Invalid API key — click ⚙.':('Error '+res.status+': '+t.slice(0,180));wait.className='amsg sys';$('askSend').disabled=false;return;}
    const j=await res.json();const txt=(j.content||[]).map(b=>b.text||'').join('').trim()||'(no answer)';wait.textContent=txt;ASK_HIST.push({role:'assistant',content:txt});
  }catch(e){wait.textContent='Network error: '+e.message;wait.className='amsg sys';}$('askSend').disabled=false;}
function initAsk(){const SUG=['What should I fix first?','Which clinics have unanswered negative reviews?','Who is falling behind rivals on MH?','Where did GMB leads drop?'];
  $('askSug').innerHTML=SUG.map(s=>`<span>${s}</span>`).join('');
  $('askSug').querySelectorAll('span').forEach(el=>el.onclick=()=>{$('askInput').value=el.textContent;$('askInput').focus();});
  $('askLaunch').onclick=()=>{$('askPanel').classList.add('on');$('askLaunch').style.display='none';
    if(!$('askMsgs').children.length)askAdd('sys','Ask me what to fix on GMB. I read the current scope + category and the flagged clinics.');$('askInput').focus();};
  $('askClose').onclick=()=>{$('askPanel').classList.remove('on');$('askLaunch').style.display='flex';};
  $('askGear').onclick=()=>askSetKey();
  $('askForm').onsubmit=e=>{e.preventDefault();const q=$('askInput').value.trim();if(!q)return;$('askInput').value='';askSend(q);};
  $('askInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('askForm').requestSubmit();}});
}

Promise.all([
  fetch('data_gmb_tab.json',{cache:'no-store'}).then(r=>r.json()),
  fetch('data_reviews_neg.json',{cache:'no-store'}).then(r=>r.json()).catch(()=>({}))
]).then(([d,neg])=>{
  DATA=d; NEG=neg; $('foot').textContent=d._meta.note;
  initControls(); render(); initAsk();
}).catch(e=>{$('board').innerHTML='<div class="empty">Failed to load data_gmb_tab.json — run scripts/build_gmb_cube.py</div>';});
</script>
