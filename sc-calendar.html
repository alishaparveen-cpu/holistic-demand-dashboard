<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SC calendar — day-on-day · lead age vs availability</title>
<style>
:root{--accent:#2C6CAE;--ink:#1f2733;--ink2:#404a58;--muted:#6b7580;--faint:#9aa3b0;--line:#e6e9ee;--bg:#f6f7f9;--card:#fff;
      --done:#2E7D5B;--sched:#3E7CB1;--noshow:#B8503C;--rel:#C9862A;--purple:#7C5CBF;}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
a{color:var(--accent);text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 70px}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{color:var(--muted);font-size:12.5px}
.nav{margin:3px 0 14px;font-size:12.5px}.nav a{margin-right:14px;color:var(--muted)}
.controls{display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 13px;margin-bottom:16px}
.controls label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-right:5px}
select{font:13px inherit;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:5px 9px;background:#fff}
.hd{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin:20px 0 8px}
.cal{display:grid;grid-template-columns:0.72fr repeat(7,1fr);gap:8px}
.day.dayall{background:color-mix(in srgb,var(--accent) 7%,#fff);border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.day.dayall .dn{color:var(--accent)}
.day{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 10px 11px;cursor:pointer;transition:border-color .12s,box-shadow .12s}
.day:hover{border-color:var(--accent)}
.day.sel{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,#fff)}
.day .dn{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.day .dv{font-size:26px;font-weight:800;margin-top:2px;line-height:1}
.day .dvsub{font-size:11px;color:var(--muted);font-weight:500}
.day .dl{font-size:10.5px;color:var(--muted);margin-top:1px}
.bchip{display:inline-block;margin-top:6px;font-size:11.5px;font-weight:700;color:var(--ink2);background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:2px 10px}
.bchip span{color:var(--muted);font-weight:500}
.sbar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:8px;background:var(--bg)}
.sbar i{height:100%}
.leadmini{font-size:10.5px;color:var(--muted);margin-top:7px;border-top:1px dashed var(--line);padding-top:6px}
.leadmini b{color:var(--ink2)}
.detail{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px}
.detail h3{margin:0 0 3px;font-size:15px;font-weight:700}
.detail .ds{font-size:12px;color:var(--muted);margin-bottom:12px}
.bars{display:flex;flex-direction:column;gap:6px;max-width:660px}
.brow{display:grid;grid-template-columns:132px 1fr 66px;gap:10px;align-items:center;font-size:13px;cursor:pointer;border-radius:6px;padding:2px 4px;transition:background .1s}
.brow:hover{background:var(--bg)}
.brow.on{background:color-mix(in srgb,var(--accent) 9%,#fff)}
.brow .bl{color:var(--ink2)}
.btrack{height:16px;background:var(--bg);border-radius:5px;overflow:hidden}
.bfill{height:100%;border-radius:5px}
.brow .bn{text-align:right;font-weight:700}
.legend{font-size:11px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:middle}
.verdict{border-radius:12px;padding:13px 15px;margin:18px 0;border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--card);font-size:13.5px;line-height:1.55}
.verdict b{font-weight:700}
.note{background:#fbf7ee;border:1px solid #efe3c8;border-radius:9px;padding:10px 13px;font-size:12px;color:#7a6a3f;margin-bottom:14px}
.foot{color:var(--faint);font-size:11.5px;margin-top:20px}
/* booking / lead tables */
.bkwrap{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;overflow-x:auto}
.bkwrap h4{margin:0 0 8px;font-size:13px;font-weight:700}
.btbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px}
.btbl th{text-align:left;font-weight:600;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;padding:5px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.btbl td{padding:6px 10px;border-bottom:1px solid var(--bg);vertical-align:middle;white-space:nowrap}
.btbl tr:hover td{background:var(--bg)}
.pid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--ink2);cursor:copy}
.pid:hover{color:var(--accent);text-decoration:underline}
.ph{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--ink2)}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:20px;border:1px solid var(--line)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.yes{color:var(--done);font-weight:700}.no{color:var(--noshow);font-weight:700}.na{color:var(--faint)}
.rec{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--accent);font-weight:600}
.srcGoogle{color:#B8503C}.srcGMB{color:#2E7D5B}.srcMeta{color:#3E5FA8}.srcPracto{color:#7C5CBF}.srcOrganic{color:#8a7a3f}
.catMH{color:#7C5CBF;border-color:#d9cff0}.catSH{color:#3E5FA8;border-color:#cdd8ef}.catSTI{color:#B8503C;border-color:#f0d4cd}.catED{color:#8a6a2a;border-color:#ecdfc0}
.ntico{cursor:help;font-size:12px;opacity:.75}.ntico:hover{opacity:1}
.rzn{font-size:10px;color:var(--muted);margin-top:1px;cursor:help}.rzn.rznD{color:var(--noshow);font-weight:700}
.frow th{padding:3px 6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.fsel,.fin{font:11px inherit;color:var(--ink2);padding:3px 5px;border:1px solid var(--line);border-radius:5px;background:#fff;width:100%;max-width:150px}
.ftbar{display:flex;align-items:center;gap:10px;margin:4px 0 8px;font-size:12px;color:var(--muted)}
.ftclear{font:11px inherit;color:var(--accent);background:none;border:1px solid var(--line);border-radius:6px;padding:2px 9px;cursor:pointer}
.uniqlab{font-size:12px;color:var(--ink2);display:inline-flex;align-items:center;gap:5px;cursor:pointer}.uniqlab input{cursor:pointer}
.ftmore{text-align:center;margin-top:8px}
.ftmorebtn{font:12px inherit;font-weight:600;color:var(--accent);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:5px 16px;cursor:pointer}
.ftmorebtn:hover{background:var(--bg)}
.ftclear:hover{background:var(--bg)}
.btbl thead th{position:sticky;top:0;background:var(--card);z-index:1}
#summpop{display:none;position:fixed;z-index:50;max-width:320px;background:#1f2733;color:#f3f5f8;font-size:12px;line-height:1.5;padding:10px 12px;border-radius:9px;box-shadow:0 6px 24px rgba(0,0,0,.28)}
.summt{display:inline-block;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;color:var(--ink2)}
.summt.exp{white-space:normal;max-width:380px}
.smore{cursor:pointer;font-size:11px;color:var(--accent);margin-left:2px;white-space:nowrap}
.wknav{display:flex;align-items:center;gap:8px}
.wkbtn{font:13px inherit;font-weight:700;color:var(--accent);background:var(--card);border:1px solid var(--line);border-radius:7px;width:28px;height:26px;cursor:pointer;line-height:1}
.wkbtn:hover:not(:disabled){background:var(--bg)}
.wkbtn:disabled{color:var(--faint);cursor:default;opacity:.5}
</style>
</head>
<body>
<div id="summpop"></div>
<div class="wrap">
  <h1>🗓️ SC calendar — day-on-day</h1>
  <div class="nav"><a href="index.html">← Home</a><a href="bookings-funnel.html">Demand view</a></div>

  <div class="controls">
    <span><label>Clinic</label><select id="clinS"></select></span>
    <span><label>Doctor</label><select id="docS"></select></span>
    <span style="margin-left:auto" class="wknav"><button id="wkprev" class="wkbtn" title="previous week">◀</button><span class="sub" id="wkflag"></span><button id="wknext" class="wkbtn" title="next week">▶</button></span>
  </div>

  <div class="hd">① Screening calls — click a day to filter, or filter any column below</div>
  <div class="cal" id="cal"></div>

  <div class="detail" id="detail"></div>

  <div class="hd">② Every lead — filter any column</div>
  <div class="cal" id="leadCal"></div>
  <div class="detail" id="leadDetail"></div>

</div>
<script>
let D=null, CK=null, DOC='all', WK=0, FB={}, FL={};   // FB/FL = per-column filter state; DOC = top-level doctor filter (bookings); WK = selected week index into _meta.weeks
const $=id=>document.getElementById(id);
const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const AGES=['0','1','2','3','4','5','6','7','8+','no_lead'];
const ALAB={'0':'Same day','1':'1 day old','2':'2 days old','3':'3 days old','4':'4 days old','5':'5 days old','6':'6 days old','7':'7 days old','8+':'8+ days old','no_lead':'No lead matched'};
const ACOL={'0':'#2E7D5B','1':'#3E7CB1','2':'#4E97A8','3':'#6FA98F','4':'#9CAE6B','5':'#C9A43A','6':'#C9862A','7':'#C06A2E','8+':'#B8503C','no_lead':'#c7ccd4'};
const STCOL={done:'var(--done)',sched:'var(--sched)',noshow:'var(--noshow)',resched:'var(--rel)',cancelled:'#9a5a3a',other:'#c7ccd4'};
const STLAB={done:'Completed',sched:'Scheduled',noshow:'No-show',resched:'Rescheduled',cancelled:'Cancelled',other:'Other'};
const STORDER=['done','sched','noshow','resched','cancelled','other'];
// Match the clinician calendar's headline status: a slot that NO-SHOWED and was later rescheduled
// carries status=RESCHEDULED but previous_status=MISSED — the clinician calendar shows "No Show".
// Only this exact case is overridden (COMPLETED-after-MISSED stays Completed; proactive SCHEDULED→RESCHEDULED stays Rescheduled).
function effSt(b){return (b.st==='resched' && b.prevst==='MISSED') ? 'noshow' : b.st;}
// Episode-level FINAL outcome (clinician calendar's "Latest booking status"): where the whole consultation ended,
// following the reschedule/cancel chain. Blank when this row already IS the terminal (no onward chain).
function isFinalRow(b){return !b.finalst || (b.finalst===effSt(b) && b.finalday===b._day);}
function finalVal(b){return isFinalRow(b)?'—':(STLAB[b.finalst]||b.finalst);}
function finalCell(b){
  if(isFinalRow(b)) return '<span class="na">—</span>';
  const dt=b.finalday?dlabel(b.finalday):null;
  return `<span class="dot" style="background:${STCOL[b.finalst]}"></span>${STLAB[b.finalst]}${dt?` <span style="color:var(--muted)">${dt.dow} ${dt.dm}</span>`:''}`;
}
function fmtTime(t){if(!t||t.indexOf(':')<0)return '';let[h,m]=t.split(':').map(Number);const ap=h<12?'AM':'PM';h=h%12||12;return h+':'+String(m).padStart(2,'0')+' '+ap;}
const SRCCLS=s=>'src'+(s||'').replace(/[^A-Za-z]/g,'');
const STRLAB={STRONG:'Strong',NOT_A_PATIENT:'Not a patient',COULD_NOT_DETERMINE:'Unclear'};
const STRCLS={STRONG:'yes',NOT_A_PATIENT:'no',COULD_NOT_DETERMINE:'na'};
const CARELAB={TALK_TO_THERAPIST:'Therapist',TALK_TO_DOCTOR:'Doctor',NEEDS_TESTS:'Tests',NEEDS_MEDS:'Meds',COULD_NOT_DETERMINE:'Unclear',OTHER:'Other'};
const TIERLAB={coded:'Direct (code)',booked:'Booked here',locality:'Said locality'};
function hasConn(l){return (l.recs||[]).some(r=>r.d>0);}           // any call that actually connected (>0s audio)
function connOnCell(l){
  const cs=(l.recs||[]).filter(r=>r.d>0&&r.dt);
  if(!cs.length) return hasConn(l)?'<span class="yes">✓</span>':'<span class="na">—</span>';
  const seen={}; cs.forEach(r=>{ if(!seen[r.dt]) seen[r.dt]=r.dir; });
  return Object.keys(seen).sort().map(dt=>{const L=dlabel(dt);return `${L.dow} ${L.dm} <span style="color:var(--faint);font-size:10px">${seen[dt]==='outbound'?'out':'in'}</span>`;}).join('<br>');
}
const CATLAB={MENTAL_HEALTH:'MH',SEXUAL_HEALTH_GENERAL:'SH',STI:'STI',ERECTILE_DYSFUNCTION:'ED',PREMATURE_EJACULATION:'PE',NOT_MENTIONED:'',OTHER:'Other'};
const CATCLS={MENTAL_HEALTH:'catMH',SEXUAL_HEALTH_GENERAL:'catSH',STI:'catSTI',ERECTILE_DYSFUNCTION:'catED',PREMATURE_EJACULATION:'catED'};
function catCell(cat){const lab=CATLAB[cat]; if(lab===undefined&&cat){return `<span class="chip">${cat}</span>`;} if(!lab) return '<span class="na">—</span>'; return `<span class="chip ${CATCLS[cat]||''}">${lab}</span>`;}
function esc(s){return (s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function noteIcon(summ){return summ?` <span class="ntico" data-s="${esc(summ)}" onclick="showSumm(event,this)" title="click for call summary">📝</span>`:'';}
function summCell(s){if(!s)return '<span class="na">—</span>';return `<span class="summt">${esc(s)}</span>${s.length>55?' <a class="smore" onclick="toggleSumm(event)">more</a>':''}`;}
function toggleSumm(e){e.stopPropagation();const sp=e.target.previousElementSibling;const on=sp.classList.toggle('exp');e.target.textContent=on?'less':'more';}
function showSumm(e,el){e.stopPropagation();const p=$('summpop');p.textContent=el.dataset.s;p.style.display='block';
  const x=Math.min(e.clientX,window.innerWidth-330), y=e.clientY+14;
  p.style.left=x+'px';p.style.top=y+'px';}
document.addEventListener('click',e=>{if(!e.target.classList||!e.target.classList.contains('ntico')){const p=$('summpop');if(p)p.style.display='none';}});
function bookedCell(l){
  if(!l.booked) return '<span class="no">✗ not booked</span>';
  const tm=l.bktime?` <span style="color:var(--muted)">${fmtTime(l.bktime)}</span>`:'';
  const dt=l.bkdate?dlabel(l.bkdate):null;
  const dm=dt?` <span style="color:var(--muted)">${dt.dow} ${dt.dm}</span>`:'';
  if(l.blag==null) return `<span class="yes">✓ booked</span>${dm}${tm}`;
  if(l.blag<0) return `<span class="na">earlier lead</span>${dm}${tm}`;
  const lag=l.blag===0?'same day':`+${l.blag}d`;
  return `<span class="yes">${lag}</span>${dm}${tm}`;
}
function dlabel(iso){const dt=new Date(iso+'T00:00:00');return {dow:DOW[(dt.getDay()+6)%7],dm:dt.getDate()};}
function ageKey(bk){return bk.age==null?'no_lead':(bk.age<=7?String(bk.age):'8+');}
function countBy(arr,fn){const m={};arr.forEach(x=>{const k=fn(x);m[k]=(m[k]||0)+1});return m;}
function bookingsOf(iso){return (D.clinics[CK].days[iso].bookings||[]).filter(b=>DOC==='all'||b.doc===DOC);}
function copyPid(el){navigator.clipboard&&navigator.clipboard.writeText(el.dataset.full);const t=el.textContent;el.textContent='copied ✓';setTimeout(()=>el.textContent=t,900);}
function mmss(s){s=+s||0;return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function recsCell(recs){
  if(!recs||!recs.length) return '<span class="na">—</span>';
  return recs.map(r=>{const dt=r.dt?dlabel(r.dt):null,out=r.dir==='outbound',noconn=r.d===0;
    // 0-second = ring-no-answer (no audio) → show as "tried", not a play link
    const inner=`${noconn?'✕':'▶'} ${mmss(r.d)} <span style="color:${out?'#8a6a2a':'var(--done)'};font-weight:600;font-size:10px">${out?'out':'in'}</span>${dt?` <span style="color:var(--faint);font-weight:400">${dt.dow} ${dt.dm}</span>`:''}`;
    return noconn ? `<span class="rec" style="color:var(--faint)" title="${(out?'outbound':'inbound')} attempt — not connected (no recording)">${inner}</span>`
                  : `<a class="rec" href="${r.u}" target="_blank" rel="noopener" title="${(out?'outbound (clinic→patient) ':'inbound ')+(r.dt||'')}">${inner}</a>`;}).join('<br>');
}
function catVal(cat){if(!cat)return '—';const l=CATLAB[cat];return l===undefined?cat:(l||'—');}
function pidCell(x){return x.pid?`<span class="pid" data-full="${x.pid}" onclick="copyPid(this)">${x.pid}</span>`:'<span class="na">—</span>';}
const dayDisp=iso=>{const dt=dlabel(iso);return dt.dow+' '+dt.dm;};
function isoMinus(iso,n){const dt=new Date(iso+'T00:00:00');dt.setDate(dt.getDate()-n);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fullDate(iso){const dt=new Date(iso+'T00:00:00');return DOW[(dt.getDay()+6)%7]+' '+dt.getDate()+' '+MON[dt.getMonth()];}
function leadCameCell(b){if(b.age==null||!b.bkmade)return '<span class="na">no lead</span>';const iso=isoMinus(b.bkmade,b.age);return `${fullDate(iso)}${b.age>30?` <span style="color:var(--faint)">(+${b.age}d)</span>`:''}`;}
function apptGap(b){if(b.age==null||!b.bkmade||!b._day)return null;const lc=isoMinus(b.bkmade,b.age);return Math.round((new Date(b._day+'T00:00:00')-new Date(lc+'T00:00:00'))/864e5);}  // days from lead arrival → SC appointment

// booking table columns
const BCOLS=[
 {k:'day',label:'Day',filt:'sel',val:b=>b._day,selDisp:dayDisp,cell:b=>dayDisp(b._day)},
 {k:'pid',label:'Patient ID',filt:'txt',val:b=>b.pid,cell:pidCell},
 {k:'p',label:'Phone',filt:'txt',val:b=>b.p,cell:b=>`<span class="ph">${b.p||'—'}</span>`},
 {k:'doc',label:'Doctor',filt:'sel',val:b=>b.doc,cell:b=>b.doc.replace(/^Dr\.?\s*/,'')},
 {k:'cat',label:'Category',filt:'sel',val:b=>catVal(b.cat),cell:b=>catCell(b.cat)},
 {k:'src',label:'Source',filt:'sel',val:b=>b.src,cell:b=>`<span class="chip ${SRCCLS(b.src)}">${b.src}</span>`},
 {k:'med',label:'Medium',filt:'sel',val:b=>b.med,cell:b=>b.med},
 {k:'leadcame',label:'Lead came',filt:'sel',val:b=>(b.age==null||!b.bkmade)?'':isoMinus(b.bkmade,b.age),selDisp:iso=>iso?fullDate(iso):'no lead',cell:leadCameCell},
 {k:'age',label:'Lead→appt',filt:'sel',val:b=>{const g=apptGap(b);return g==null?'no lead':(g===0?'same day':g===1?'+1d':g<=3?'+2–3d':g<=7?'+4–7d':'8+d');},cell:b=>{const g=apptGap(b);return g==null?'<span class="na">no lead</span>':(g===0?'same day':'+'+g+'d');}},
 {k:'bkmade',label:'Booked on',filt:'sel',val:b=>b.bkmade||'',selDisp:iso=>iso?fullDate(iso):'—',cell:b=>b.bkmade?fullDate(b.bkmade):'—'},
 {k:'bookedfor',label:'Booked for (appt)',filt:null,cell:b=>fullDate(b._day)+(b.sctime?` <span style="color:var(--muted)">${fmtTime(b.sctime)}</span>`:'')},
 {k:'st',label:'Status',filt:'sel',val:b=>effSt(b),selDisp:STLAB,cell:b=>{const s=effSt(b);return `<span class="dot" style="background:${STCOL[s]}"></span>${STLAB[s]}`;}},
 {k:'finalst',label:'Final outcome',filt:'sel',val:finalVal,cell:finalCell},
 {k:'rzn',label:'Move reason',filt:'sel',val:b=>b.rzn||'—',selDisp:{doctor:'Doctor-side',patient:'Patient-side',other:'Other','—':'—'},cell:b=>b.rzntxt?`<span class="rzn ${b.rzn==='doctor'?'rznD':''}" title="${esc(b.rzntxt)}">${b.rzn==='doctor'?'⚠ doctor':b.rzn==='patient'?'patient':'other'}</span>`:'<span class="na">—</span>'},
 {k:'mode',label:'Mode',filt:'sel',val:b=>b.mode,cell:b=>b.mode},
 {k:'rec',label:'Recording',filt:null,cell:b=>recsCell(b.recs)},
 {k:'summ',label:'Call summary',filt:'txt',val:b=>b.summ,cell:b=>summCell(b.summ)},
];
// lead table columns
const LCOLS=[
 {k:'day',label:'Day',filt:'sel',val:l=>l._day,selDisp:dayDisp,cell:l=>dayDisp(l._day)},
 {k:'pid',label:'Patient ID',filt:'txt',val:l=>l.pid,cell:pidCell},
 {k:'p',label:'Phone',filt:'txt',val:l=>l.p,cell:l=>`<span class="ph">${l.p||'—'}</span>`},
 {k:'cat',label:'Category',filt:'sel',val:l=>catVal(l.cat),cell:l=>catCell(l.cat)},
 {k:'src',label:'Source',filt:'sel',val:l=>l.src,cell:l=>`<span class="chip ${SRCCLS(l.src)}">${l.src}</span>`},
 {k:'med',label:'Medium',filt:'sel',val:l=>l.med,cell:l=>l.med},
 {k:'tier',label:'Attribution',filt:'sel',val:l=>TIERLAB[l.tier]||l.tier||'Direct (code)',cell:l=>`<span class="chip">${TIERLAB[l.tier]||l.tier||'Direct (code)'}</span>`},
 {k:'conn',label:'Connected',filt:'sel',val:l=>hasConn(l)?'Yes':((l.recs&&l.recs.length)?'No':'—'),cell:l=>hasConn(l)?'<span class="yes">✓ yes</span>':((l.recs&&l.recs.length)?'<span class="no">✗ no</span>':'<span class="na">—</span>')},
 {k:'connon',label:'Connected on',filt:'sel',multi:true,val:l=>[...new Set((l.recs||[]).filter(r=>r.d>0&&r.dt).map(r=>r.dt))],selDisp:iso=>iso?fullDate(iso):'—',cell:connOnCell},
 {k:'strength',label:'Intent',filt:'sel',val:l=>l.strength?(STRLAB[l.strength]||l.strength):'—',cell:l=>l.strength?`<span class="${STRCLS[l.strength]||'na'}">${STRLAB[l.strength]||l.strength}</span>`:'<span class="na">—</span>'},
 {k:'leadcame',label:'Lead came',filt:null,cell:l=>fullDate(l._day)},
 {k:'booked',label:'Booked for',filt:'sel',val:l=>!l.booked?'not booked':(l.blag===0?'same day':l.blag>0?'+'+l.blag+'d':l.blag<0?'earlier':'booked'),cell:bookedCell},
 {k:'bookedat',label:'Booked at',filt:'sel',val:l=>!l.bookedat?'—':(l.bookedat===(D.clinics[CK]&&D.clinics[CK].disp)?'✓ here':'→ '+l.bookedat),cell:l=>!l.bookedat?'<span class="na">—</span>':(l.bookedat===(D.clinics[CK]&&D.clinics[CK].disp)?'<span class="yes">✓ here</span>':`<span class="no" style="font-weight:600">→ ${l.bookedat}</span>`)},
 {k:'nbreason',label:'Why not booked',filt:'sel',val:l=>l.nbreason||'—',cell:l=>l.nbreason?`<span title="${esc(l.nbnote||'')}" style="cursor:help;border-bottom:1px dotted var(--faint)">${l.nbreason}</span>`:'<span class="na">—</span>'},
 {k:'rec',label:'Recording',filt:null,cell:l=>recsCell(l.recs)},
 {k:'summ',label:'Call summary',filt:'txt',val:l=>l.summ,cell:l=>summCell(l.summ)},
];

// generic filterable table: builds header + per-column filter row once; filter changes only re-render the body (keeps input focus)
function filterTable(el, rows, cols, fstate){
  const opts={}; cols.forEach(c=>{if(c.filt==='sel')opts[c.k]=[...new Set(c.multi?rows.flatMap(r=>c.val(r)||[]):rows.map(r=>c.val(r)))].filter(x=>x!==''&&x!=null).sort();});
  const dispOpt=(c,o)=>c.selDisp?(typeof c.selDisp==='function'?c.selDisp(o):(c.selDisp[o]||o)):o;
  const head=cols.map(c=>`<th>${c.label}</th>`).join('');
  const frow=cols.map(c=>{
    if(c.filt==='txt') return `<th><input data-fk="${c.k}" class="fin" placeholder="search" value="${esc(fstate[c.k]||'')}"></th>`;
    if(c.filt==='sel') return `<th><select data-fk="${c.k}" class="fsel"><option value="">All</option>${opts[c.k].map(o=>`<option value="${esc(o)}"${fstate[c.k]===o?' selected':''}>${esc(dispOpt(c,o))}</option>`).join('')}</select></th>`;
    return '<th></th>';
  }).join('');
  const pidCol=cols.find(c=>c.k==='pid');
  const uniqBox=pidCol?`<label class="uniqlab"><input type="checkbox" class="uniq"${fstate._uniq?' checked':''}> unique patients only</label>`:'';
  el.innerHTML=`<div class="ftbar"><span class="ftcount"></span>${uniqBox}<button class="ftclear">clear filters</button></div><div class="bkwrap"><table class="btbl"><thead><tr>${head}</tr><tr class="frow">${frow}</tr></thead><tbody></tbody></table></div><div class="ftmore"></div>`;
  const tb=el.querySelector('tbody'), cnt=el.querySelector('.ftcount'), more=el.querySelector('.ftmore');
  const PAGE=5; let limit=PAGE;
  function apply(){
    const base=rows.filter(r=>cols.every(c=>{if(!c.filt)return true;const fv=fstate[c.k];if(!fv)return true;const rv=c.val(r);
      return c.filt==='txt'?String(rv||'').toLowerCase().includes(fv.toLowerCase()):(c.multi?(rv||[]).includes(fv):rv===fv);}));
    const uniqN=pidCol?new Set(base.map(r=>pidCol.val(r)).filter(Boolean)).size:null;
    let fr=base;
    if(fstate._uniq&&pidCol){const seen=new Set();fr=base.filter(r=>{const k=pidCol.val(r);if(!k)return true;if(seen.has(k))return false;seen.add(k);return true;});}
    const shown=limit>=fr.length?fr:fr.slice(0,limit);
    tb.innerHTML=fr.length?shown.map(r=>`<tr>${cols.map(c=>`<td>${c.cell(r)}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${cols.length}" style="color:var(--faint);padding:14px">No rows match these filters.</td></tr>`;
    cnt.textContent=fstate._uniq&&pidCol?`${fr.length} patients (from ${base.length} rows)`:`${base.length} of ${rows.length} shown${pidCol?` · ${uniqN} patients`:''}`;
    more.innerHTML = fr.length>PAGE ? (limit<fr.length ? `<button class="ftmorebtn">Show all ${fr.length} ▾</button>` : `<button class="ftmorebtn">Show less ▴</button>`) : '';
    const mb=more.querySelector('.ftmorebtn'); if(mb) mb.onclick=()=>{limit=limit<fr.length?fr.length:PAGE;apply();};
  }
  const reset=()=>{limit=PAGE;};
  el.querySelectorAll('.fsel').forEach(s=>s.addEventListener('change',()=>{fstate[s.dataset.fk]=s.value;reset();apply();}));
  el.querySelectorAll('.fin').forEach(i=>i.addEventListener('input',()=>{fstate[i.dataset.fk]=i.value;reset();apply();}));
  const ub=el.querySelector('.uniq'); if(ub) ub.addEventListener('change',e=>{fstate._uniq=e.target.checked;reset();apply();});
  el.querySelector('.ftclear').addEventListener('click',()=>{cols.forEach(c=>delete fstate[c.k]);fstate._uniq=false;reset();el.querySelectorAll('.fsel').forEach(s=>s.value='');el.querySelectorAll('.fin').forEach(i=>i.value='');const u=el.querySelector('.uniq');if(u)u.checked=false;apply();});
  apply();
}

function render(){
  const c=D.clinics[CK], wk=D._meta.weeks[WK], days=wk.days;
  $('wkflag').textContent='Week '+wk.week;
  $('wkprev').disabled = WK<=0;
  $('wknext').disabled = WK>=D._meta.weeks.length-1;

  const dOf=bks=>DOC==='all'?bks:bks.filter(b=>b.doc===DOC);   // top-level doctor filter (bookings only)

  // ① booking day-cards (overview; click filters the table by day; "All" clears the day filter)
  const allB=days.reduce((n,iso)=>n+dOf(c.days[iso].bookings||[]).length,0);
  $('cal').innerHTML=`<div class="day dayall${!FB.day?' sel':''}" data-all="1"><div class="dn">ALL</div><div class="dv" style="color:var(--done)">${allB}</div><div class="dl">all 7 days</div></div>`
    +days.map(iso=>{const bks=dOf(c.days[iso].bookings||[]),L=dlabel(iso),tot=bks.length;const done=countBy(bks,b=>b.st).done||0;
    return `<div class="day${FB.day===iso?' sel':''}" data-d="${iso}">
      <div class="dn">${L.dow} ${L.dm}</div>
      <div class="dv" style="color:var(--done)">${tot}</div><div class="dl">booked</div>
      <div><span class="bchip">${done} <span>completed</span></span></div>
    </div>`;}).join('');
  $('cal').querySelectorAll('.day[data-d]').forEach(el=>el.onclick=()=>{FB.day=(FB.day===el.dataset.d?'':el.dataset.d);render();});
  $('cal').querySelector('[data-all]').onclick=()=>{FB.day='';render();};

  // ① filterable bookings table (all days, doctor-filtered)
  const allBk=days.flatMap(iso=>dOf(c.days[iso].bookings||[]).map(b=>Object.assign({_day:iso},b)));
  filterTable($('detail'), allBk, BCOLS, FB);

  // ② leads day-cards (overview; click filters the leads table by day)
  const allL=days.reduce((n,iso)=>n+(c.days[iso].leads||[]).length,0);
  $('leadCal').innerHTML=`<div class="day dayall${!FL.day?' sel':''}" data-lall="1"><div class="dn">ALL</div><div class="dv">${allL}</div><div class="dl">all 7 days</div></div>`
    +days.map(iso=>{const tl=(c.days[iso].leads||[]).length,L=dlabel(iso);
    return `<div class="day${FL.day===iso?' sel':''}" data-l="${iso}">
      <div class="dn">${L.dow} ${L.dm}</div><div class="dv">${tl}</div><div class="dl">leads</div>
    </div>`;}).join('');
  $('leadCal').querySelectorAll('.day[data-l]').forEach(el=>el.onclick=()=>{FL.day=(FL.day===el.dataset.l?'':el.dataset.l);render();});
  $('leadCal').querySelector('[data-lall]').onclick=()=>{FL.day='';render();};

  // ② filterable leads table (all days)
  const allLd=days.flatMap(iso=>(c.days[iso].leads||[]).map(l=>Object.assign({_day:iso},l)));
  $('leadDetail').style.display='';
  filterTable($('leadDetail'), allLd, LCOLS, FL);
}

fetch('data_sc_calendar.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{
  D=d; const cs=Object.keys(d.clinics);
  $('clinS').innerHTML=cs.map(k=>`<option value="${k}">${d.clinics[k].disp}</option>`).join('');
  CK=cs[0]; $('clinS').value=CK;
  WK=d._meta.weeks.length-1;                       // default to the newest complete week
  const resetDay=()=>{FB={day:''}; FL={day:''};};   // default to ALL days (not the first day)
  resetDay();
  const loadDocs=()=>{const docs=(D.clinics[CK].doctors||[]);DOC='all';
    $('docS').innerHTML=`<option value="all">All doctors</option>`+docs.map(x=>`<option value="${x}">${x.replace(/^Dr\.?\s*/,'')}</option>`).join('');};
  loadDocs();
  $('clinS').onchange=e=>{CK=e.target.value;resetDay();loadDocs();render();};
  $('docS').onchange=e=>{DOC=e.target.value;FB={day:FB.day||''};render();};
  $('wkprev').onclick=()=>{if(WK>0){WK--;resetDay();render();}};
  $('wknext').onclick=()=>{if(WK<D._meta.weeks.length-1){WK++;resetDay();render();}};
  render();
}).catch(e=>{$('detail').innerHTML='Failed to load data_sc_calendar.json — run scripts/build_sc_calendar.py';});
</script>
