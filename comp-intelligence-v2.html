.tile{background:var(--wash);border-radius:10px;padding:11px 13px;border-left:4px solid var(--teal)}

.panels{display:grid;grid-template-columns:1fr;gap:18px;margin-top:14px}
.panel{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel h3{margin:0;padding:11px 15px;font-size:15px;background:var(--teal);color:#fff;display:flex;justify-content:space-between;align-items:center}
.panel h3 .badge{font-size:11px;font-weight:600;background:rgba(255,255,255,.2);padding:2px 9px;border-radius:10px}
.phead{font-size:12px;color:var(--grey);padding:8px 15px;border-bottom:1px solid var(--line);background:#fbfdfd}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 15px;border-bottom:1px solid var(--line)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--grey);font-weight:600}
td.num,th.num{text-align:right}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap}
.win{background:#E3F1E8;color:var(--green)}.def{background:#FBEFD9;color:var(--amber)}.build{background:#F6E1E1;color:var(--red)}

.empty{padding:14px 15px;color:var(--grey);font-style:italic}
.up{color:var(--green);font-weight:700}.down{color:var(--red);font-weight:700}
.legend{font-size:11px;color:var(--grey);margin-top:6px}

  sel.onchange=()=>{CITY=sel.value;render();};
}
function tile(k,label,val,target){const cls=tileCls(k,val);return `<div class="tile ${cls}"><div class="k">${label}</div><div class="v">${val==null?'—':pct(val)}</div>${target?`<div class="t">target ${target}%</div>`:''}</div>`;}
function render(){
  const d=DATA[CAT].cities[CITY];if(!d){$('#main').innerHTML='<p>No data.</p>';return;}
  const f=d.funnel||{},o=d.our||{};
  // velocity arrow
  let velHtml='—';
  if(o.per_mo!=null){const up=o.prev_per_mo!=null&&o.per_mo>=o.prev_per_mo;const arrow=o.prev_per_mo==null?'':`<span class="${up?'up':'down'}">${up?'▲':'▼'}</span>`;
    velHtml=`${o.per_mo}/mo ${arrow}<div class="t">was ${o.prev_per_mo==null?'—':o.prev_per_mo}/mo · last review ${o.days_since_last==null?'—':o.days_since_last+'d ago'}</div>`;}
  let h=`<h2 class="city">${CITY} <span style="font-size:14px;color:var(--grey);font-weight:400">· ${({SH:'Sexual Health',STI:'STI',MH:'Mental Health'})[CAT]}</span></h2>`;
  // conversion levers
  h+=`<div class="legend"><b>Conversion levers</b> — where paid clicks are won or lost after the auction:</div>`;
  h+='<div class="tiles">'+
     tile('IS','Impression share',f.IS,70)+
     tile('locpct','Local %',f.locpct,60)+
     tile('loc2ld','Loc-click → lead',f.loc2ld,30)+
     tile('','Lead → book',f.ld2bk,null)+
     tile('','Book → done',f.bk2dn,null)+
     `<div class="tile"><div class="k">CPL</div><div class="v">${f.cpl?'₹'+f.cpl:'—'}</div><div class="t">${f.leads?f.leads+' leads/wk':''}</div></div>`+
     '</div>';
  // our profile + velocity
  h+='<div class="tiles">'+
     `<div class="tile"><div class="k">Our reviews</div><div class="v">${o.reviews??'—'}</div><div class="t">rating ${o.rating??'—'}</div></div>`+
     `<div class="tile"><div class="k">Our review velocity</div><div class="v" style="font-size:17px">${velHtml}</div></div>`+
     `<div class="tile"><div class="k">Recent rating (90d)</div><div class="v">${o.recent_rating??'—'}</div></div>`+
     '</div>';
  h+='<div class="panels">';
  // MAPS
  h+=panelMaps(d,o);
  // WEB
  h+=panelWeb(d);
  // PAID
  h+=panelPaid(d);
  h+='</div>';
  $('#main').innerHTML=h;
}
function panelMaps(d,o){
  const rows=(d.maps||[]);
  let b=`<div class="panel"><h3>① GMB / Maps pack <span class="badge">local — reviews decide the click</span></h3>`+
    `<div class="phead">Who actually shows in the local pack against us, ranked by appearances. Standing = our reviews vs theirs.</div>`;
  if(!rows.length){b+='<div class="empty">No competing clinics recorded in the local pack.</div></div>';return b;}
  b+='<table><tr><th>Rival</th><th>Type</th><th class="num">Appears</th><th class="num">Reviews (them / us)</th><th class="num">Rating</th><th>Paid?</th><th>Standing</th></tr>';
  rows.forEach(r=>{const[st,cl]=stand(o.reviews,r.reviews);
    b+=`<tr><td>${r.name}</td><td class="pathy">${r.pathy||'—'}</td><td class="num">${r.ap}</td><td class="num">${r.reviews??'—'} / ${o.reviews??'—'}</td><td class="num">${r.rating??'—'}</td><td>${r.sponsored?'<span class="ad">ADS</span>':''}</td><td><span class="pill ${cl}">${st}</span></td></tr>`;});
  b+='</table></div>';return b;
}
function panelWeb(d){
  const rows=(d.web||[]);
  let b=`<div class="panel"><h3>② Organic web / SEO <span class="badge">blue-links — domain &amp; content decide</span></h3>`+
    `<div class="phead">Who ranks in organic web results against us, by appearances. This is an SEO battle (content/backlinks) — reviews are secondary here.</div>`;
  if(!rows.length){b+='<div class="empty">No organic-web competitors recorded.</div></div>';return b;}
  b+='<table><tr><th>Domain</th><th class="num">Appears</th><th class="num">Reviews</th><th>Also runs ads?</th></tr>';
  rows.forEach(r=>{b+=`<tr><td>${r.name}</td><td class="num">${r.ap}</td><td class="num">${r.reviews??'—'}</td><td>${r.sponsored?'<span class="ad">ADS</span>':'—'}</td></tr>`;});
  b+='</table></div>';return b;
}
function panelPaid(d){
  const p=d.paid;
  let b=`<div class="panel"><h3>③ Paid / Google Ads auction <span class="badge">bid &amp; Quality Score decide</span></h3>`;
  if(!p||!p.competitors||!p.competitors.length){b+='<div class="empty">No auction-insights data for this city / category (not captured in the feed).</div></div>';return b;}
  b+=`<div class="phead">Who competes in the paid auction. Our impression share: <b>${p.you||'—'}</b> (abs-top ${p.youAbsTop||'—'}). A different rival set from organic.</div>`;
  b+='<table><tr><th>Competitor</th><th class="num">Impr. share</th><th class="num">Positioned above us</th><th class="num">Abs top</th></tr>';
  p.competitors.forEach(c=>{b+=`<tr><td>${c.domain}</td><td class="num">${c.is_||'—'}</td><td class="num">${c.posAbove||'—'}</td><td class="num">${c.absTop||'—'}</td></tr>`;});
  b+='</table></div>';return b;
}
$('#foot').innerHTML='Built '+DATA._meta.built+' · appearance-ranked from SERP scans · reviews with rating · our velocity from dated GMB reviews · surfaces split (GMB / organic-web / paid). '+DATA._meta.note;
initTabs();initCities();render();
</script></body></html>
